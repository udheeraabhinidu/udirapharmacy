<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to UDIRA PHARMACY with your Google account. Administrator login hidden.">
    <title>Account Sign In — UDIRA PHARMACY</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230ea5e9'/><text x='16' y='22' text-anchor='middle' fill='white' font-size='18' font-weight='bold'>U</text></svg>">
</head>
<body>
    <div class="auth-page">
        <canvas id="particles-canvas"></canvas>

        <div class="auth-card-inner">
            <div class="auth-header">
                <!-- Secret trigger logo for Admin panel (triple-click) -->
                <a href="#" class="nav-brand auth-logo-trigger" style="justify-content:center;margin-bottom:var(--space-3);" title="UDIRA PHARMACY">
                    <div class="nav-brand-icon">U</div>
                    <div class="nav-brand-text">UDIRA <span>PHARMACY</span></div>
                </a>
                <h2 class="auth-title" id="authCardTitle">Welcome Back</h2>
                <p class="auth-subtitle" id="authCardSubtitle">Sign in with your Google account to manage prescriptions and orders</p>
            </div>

            <!-- GOOGLE AUTH BUTTON (Primary for Customers) -->
            <button class="google-btn" onclick="Auth.googleLogin()">
                <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                Continue with Google
            </button>

            <!-- Admin Secret Access Button -->
            <div style="text-align:center;margin-top:var(--space-4);">
                <button type="button" class="btn btn-ghost btn-sm" style="font-size:0.75rem;color:var(--text-tertiary);opacity:0.7;" onclick="AdminSecretPanel.revealPanel()">
                    🔒 Administrator Access Portal
                </button>
            </div>

            <!-- HIDDEN ADMIN SECRET PANEL (Revealed on clicking link or logo above) -->
            <div class="admin-secret-panel" id="adminSecretPanel">
                <div class="admin-secret-badge">🔒 Administrator Access Portal</div>
                <form id="adminLoginForm" onsubmit="event.preventDefault(); Auth.adminLogin();">
                    <div class="form-group">
                        <label class="form-label">Admin Email</label>
                        <input type="email" id="adminLoginEmail" class="form-input" placeholder="udheeraabhinidu95@gmail.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" id="adminLoginPassword" class="form-input" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%;background:linear-gradient(135deg, #ef4444, #dc2626);">Log In to Admin Panel →</button>
                </form>
            </div>

            <div style="text-align:center;margin-top:var(--space-6);">
                <a href="index.html" style="font-size:var(--text-xs);color:var(--text-tertiary);display:inline-flex;align-items:center;gap:4px;">
                    ← Back to Website Home
                </a>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <script src="app.js"></script>
</body>
</html>
